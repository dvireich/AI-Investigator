<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Investigator</title>
    <style>
      /* Match the app background so there is no white flash before React mounts. */
      html, body { margin: 0; background-color: #0a0f1a; color: #f1f5f9; }
      #app-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background-color: #0a0f1a;
        z-index: 9999;
      }
      #app-splash .logo { width: 96px; height: 96px; display: block; }
      #app-splash .label { font-size: 14px; color: #94a3b8; letter-spacing: 0.02em; }
      #app-splash .spinner {
        width: 28px; height: 28px;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: app-splash-spin 0.9s linear infinite;
      }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-label="Loading AI Investigator" role="status">
        <svg class="logo" width="96" height="96" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <linearGradient id="ef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.8" y="0.8" width="30.4" height="30.4" rx="6.2" fill="none" stroke="url(#border)" stroke-width="1.4"/>
  <!-- Antenna stem -->
  <line x1="16" y1="5" x2="16" y2="8.5" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Antenna orb -->
  <circle cx="16" cy="3.8" r="2" fill="url(#ef)"/>
  <circle cx="16.5" cy="3.2" r="0.6" fill="white" fill-opacity="0.8"/>
  <!-- Head -->
  <rect x="5" y="8.5" width="22" height="15" rx="4.5" fill="url(#hf)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  <!-- Visor -->
  <rect x="7" y="11.5" width="18" height="7" rx="3" fill="rgba(6,182,212,0.2)"/>
  <!-- Left eye -->
  <circle cx="11.5" cy="15" r="3.2" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="0.8"/>
  <circle cx="11.5" cy="15" r="2.3" fill="url(#ef)"/>
  <circle cx="12.2" cy="14" r="0.8" fill="white" fill-opacity="0.9"/>
  <!-- Right eye -->
  <circle cx="20.5" cy="15" r="3.2" fill="none" stroke="rgba(6,182,212,0.35)" stroke-width="0.8"/>
  <circle cx="20.5" cy="15" r="2.3" fill="url(#ef)"/>
  <circle cx="21.2" cy="14" r="0.8" fill="white" fill-opacity="0.9"/>
  <!-- Mouth LED -->
  <rect x="12" y="20.5" width="1.5" height="1.2" rx="0.6" fill="#a78bfa"/>
  <rect x="14.2" y="20.5" width="3.6" height="1.2" rx="0.6" fill="#c084fc"/>
  <rect x="18.5" y="20.5" width="1.5" height="1.2" rx="0.6" fill="#a78bfa"/>
  <!-- Ear modules -->
  <rect x="1.5" y="11" width="3" height="8" rx="1.5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  <circle cx="3" cy="15" r="0.8" fill="#22d3ee" fill-opacity="0.7"/>
  <rect x="27.5" y="11" width="3" height="8" rx="1.5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  <circle cx="29" cy="15" r="0.8" fill="#22d3ee" fill-opacity="0.7"/>
  <!-- Chin accent -->
  <line x1="11" y1="23.8" x2="21" y2="23.8" stroke="rgba(139,92,246,0.3)" stroke-width="0.6" stroke-linecap="round"/>
</svg>

        <div class="spinner"></div>
        <div class="label">Starting AI Investigator&hellip;</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
