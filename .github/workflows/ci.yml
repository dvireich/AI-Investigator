name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (no coverage ignores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Lint backend (catches coverage-ignore comments)
        run: npm run lint
        working-directory: backend

      - name: Lint frontend (catches coverage-ignore comments)
        run: npm run lint
        working-directory: frontend

  backend-tests:
    name: Backend Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Extract backend coverage
        if: github.ref == 'refs/heads/main'
        id: backend-cov
        run: |
          COV=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.lines.pct)")
          TESTS=$(node -e "const s=require('./coverage/coverage-summary.json');const f=Object.keys(s).filter(k=>k!=='total');console.log(f.length)")
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "files=$TESTS" >> $GITHUB_OUTPUT

      - name: Upload coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: backend/coverage/coverage-summary.json

  frontend-tests:
    name: Frontend Tests & Coverage
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/coverage-summary.json

  publish-badges:
    name: Publish Coverage Badges
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-summary
          path: badges/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-summary
          path: badges/frontend

      - name: Update coverage badge Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
        run: |
          BE_COV=$(node -e "const s=require('./badges/backend/coverage-summary.json');console.log(s.total.lines.pct)")
          FE_COV=$(node -e "const s=require('./badges/frontend/coverage-summary.json');console.log(s.total.lines.pct)")

          get_color() {
            local pct=$1
            if [ "$pct" = "100" ]; then echo "brightgreen"
            elif (( $(echo "$pct >= 90" | bc -l) )); then echo "green"
            elif (( $(echo "$pct >= 80" | bc -l) )); then echo "yellowgreen"
            elif (( $(echo "$pct >= 70" | bc -l) )); then echo "yellow"
            elif (( $(echo "$pct >= 60" | bc -l) )); then echo "orange"
            else echo "red"
            fi
          }

          BE_COLOR=$(get_color $BE_COV)
          FE_COLOR=$(get_color $FE_COV)

          BE_JSON='{"schemaVersion":1,"label":"backend coverage","message":"'${BE_COV}'%","color":"'${BE_COLOR}'"}'
          FE_JSON='{"schemaVersion":1,"label":"frontend coverage","message":"'${FE_COV}'%","color":"'${FE_COLOR}'"}'

          echo "Backend: ${BE_COV}% (${BE_COLOR})"
          echo "Frontend: ${FE_COV}% (${FE_COLOR})"

          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "$(jq -n \
              --arg be "$BE_JSON" \
              --arg fe "$FE_JSON" \
              '{files: {"backend-coverage.json": {content: $be}, "frontend-coverage.json": {content: $fe}}}'
            )"

          echo "Badge Gist updated successfully"

  auto-release:
    name: Auto-Release on Main
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Get the latest v* tag, or default to v0.0.0 if none exist
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Parse major.minor.patch
          SEMVER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$SEMVER"

          # Check if package.json has a higher version (manual bump)
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Compare: if package.json version > latest tag, use it; otherwise auto-bump patch
          if [ "$(printf '%s\n' "$SEMVER" "$PKG_VERSION" | sort -V | tail -n1)" = "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$SEMVER" ]; then
            NEXT_VERSION="$PKG_VERSION"
            echo "Using package.json version: $NEXT_VERSION (higher than $SEMVER)"
          else
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping patch: $SEMVER -> $NEXT_VERSION"
          fi

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${NEXT_VERSION}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "Created and pushed tag v${{ steps.version.outputs.version }}"

  release-dry-run:
    name: Release Dry Run
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Build (frontend + backend)
        run: node scripts/build.js

      - name: Package executable
        run: node scripts/package.js --no-chromium

      - name: Verify release artifacts
        shell: pwsh
        run: |
          Write-Host "=== Release artifacts ==="
          Get-ChildItem release -Recurse | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
          if (!(Test-Path release\ai-investigator.exe)) {
            Write-Error "ai-investigator.exe not found in release folder!"
            exit 1
          }
          Write-Host "Dry run successful - release build verified"

  publish-release:
    name: Build & Publish Release
    needs: [auto-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get release version
        id: version
        shell: bash
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Building release for $TAG"

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Set version in package.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.version.outputs.version }}';
            for (const file of ['package.json', 'backend/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 4) + '\n');
              console.log('Updated ' + file + ' to ' + version);
            }
          "

      - name: Build (frontend + backend)
        run: node scripts/build.js

      - name: Package executable
        run: node scripts/package.js --no-chromium

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath "ai-investigator-${{ steps.version.outputs.version }}-win-x64.zip"
          Write-Host "Created ai-investigator-${{ steps.version.outputs.version }}-win-x64.zip"
          Get-Item "ai-investigator-${{ steps.version.outputs.version }}-win-x64.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "ai-investigator-${{ steps.version.outputs.version }}-win-x64.zip" `
            --title "AI Investigator ${{ steps.version.outputs.tag }}" `
            --generate-notes
