name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Extract backend coverage
        if: github.ref == 'refs/heads/main'
        id: backend-cov
        run: |
          COV=$(node -e "const s=require('./coverage/coverage-summary.json');console.log(s.total.lines.pct)")
          TESTS=$(node -e "const s=require('./coverage/coverage-summary.json');const f=Object.keys(s).filter(k=>k!=='total');console.log(f.length)")
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "files=$TESTS" >> $GITHUB_OUTPUT

      - name: Upload coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: backend/coverage/coverage-summary.json

  frontend-tests:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage summary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/coverage-summary.json

  publish-badges:
    name: Publish Coverage Badges
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-summary
          path: badges/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-summary
          path: badges/frontend

      - name: Update coverage badge Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.BADGE_GIST_ID }}
        run: |
          BE_COV=$(node -e "const s=require('./badges/backend/coverage-summary.json');console.log(s.total.lines.pct)")
          FE_COV=$(node -e "const s=require('./badges/frontend/coverage-summary.json');console.log(s.total.lines.pct)")

          get_color() {
            local pct=$1
            if [ "$pct" = "100" ]; then echo "brightgreen"
            elif (( $(echo "$pct >= 90" | bc -l) )); then echo "green"
            elif (( $(echo "$pct >= 80" | bc -l) )); then echo "yellowgreen"
            elif (( $(echo "$pct >= 70" | bc -l) )); then echo "yellow"
            elif (( $(echo "$pct >= 60" | bc -l) )); then echo "orange"
            else echo "red"
            fi
          }

          BE_COLOR=$(get_color $BE_COV)
          FE_COLOR=$(get_color $FE_COV)

          BE_JSON='{"schemaVersion":1,"label":"backend coverage","message":"'${BE_COV}'%","color":"'${BE_COLOR}'"}'
          FE_JSON='{"schemaVersion":1,"label":"frontend coverage","message":"'${FE_COV}'%","color":"'${FE_COLOR}'"}'

          echo "Backend: ${BE_COV}% (${BE_COLOR})"
          echo "Frontend: ${FE_COV}% (${FE_COLOR})"

          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "$(jq -n \
              --arg be "$BE_JSON" \
              --arg fe "$FE_JSON" \
              '{files: {"backend-coverage.json": {content: $be}, "frontend-coverage.json": {content: $fe}}}'
            )"

          echo "Badge Gist updated successfully"

  auto-release:
    name: Auto-Release on Main
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.tag }} does not exist — will create"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Created and pushed tag ${{ steps.version.outputs.tag }}"
